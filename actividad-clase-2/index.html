<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Práctica 2A</title>
    </head>
    <body>
        <div class="form-container">
            <form action="submit">
                <h1>Formulario de Actividad 2B</h1>
                <fieldset>
                    <legend>Datos Personales</legend>
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" name="name" required minlength="4" placeholder="Escribe tu nombre completo"/>

                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad" required min="1" max="120" placeholder="Años cumplidos a la fecha actual"/>

                    <fieldset>
                        <legend>Género:</legend>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="genero" name="genero" value="Femenino" />
                                <label>Femenino</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="genero" name="genero" value="Masculino" />
                                <label>Masculino</label>
                            </div>
                        </div>
                    </fieldset>
                </fieldset>
                <fieldset>
                    <legend>Preguntas</legend>
                    <fieldset for="pregunta1">
                        <legend>¿Cuál es tu sistema operativo favorito?</legend>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="pregunta1" name="pregunta1" value="windows" />
                                <label>Windows</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="pregunta1" name="pregunta1" value="macos" />
                                <label>MacOS</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="pregunta1" name="pregunta1" value="linux" />
                                <label>Linux</label>
                            </div>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>¿Qué tecnologías utilizas? (Selecciona todas las que correspondan):</legend>
                        <div class="checkbox-group">
                            <div class="checkbox-option">
                                <input type="checkbox" id="tech" name="tech" value="html" checked />
                                <label for="tech">HTML</label>
                            </div>
                            <div class="checkbox-option">
                                <input type="checkbox" id="tech" name="tech" value="css" />
                                <label for="tech">CSS</label>
                            </div>
                            <div class="checkbox-option">
                                <input type="checkbox" id="tech" name="tech" value="javascript" />
                                <label for="tech">Javascript</label>
                            </div>
                        </div>
                    </fieldset>
                </fieldset>
                <fieldset>
                    <legend>Comentarios Finales</legend>
                    <label for="comments">Escribe tus comentarios finales</label>
                    <textarea name="comments" id="comments" rows="5" cols="33"></textarea>
                </fieldset>

                <div class="button-container">
                    <button type="submit" class="btn-submit">Enviar</button>
                </div>

            </form>
        </div>
    </body>
</html>
